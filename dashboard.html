<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Dashboard รางวัลนักเรียน</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  font-family: 'Prompt', Arial, sans-serif;
  background: linear-gradient(135deg,#eef2ff,#f8fafc);
}

.container {
  max-width: 1100px;
  margin: 60px auto;
}

h2 {
  text-align: center;
  margin-bottom: 40px;
  color: #1f2937;
}

/* Cards */
.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
}

.card {
  background: #fff;
  border-radius: 18px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0,0,0,.08);
}

.card h1 {
  font-size: 42px;
  margin: 10px 0 0;
}

.card span {
  font-size: 15px;
  color: #6b7280;
}

.win { border-top: 6px solid #6366f1; }
.gold { border-top: 6px solid #facc15; }
.silver { border-top: 6px solid #9ca3af; }
.bronze { border-top: 6px solid #fb923c; }

/* Chart box */
.charts {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
  margin-top: 40px;
}

.chart-box {
  background: #fff;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 8px 20px rgba(0,0,0,.08);
}
</style>
</head>

<body>
<div class="container">
<h2>🏆 สถิติการได้รับรางวัลของนักเรียนงานศิลปหัตกรรมนักเรียนครังที่ 73 </h2>

<div class="cards">
  <div class="card win">
    <span>ชนะเลิศ</span>
    <h1 id="win">0</h1>
  </div>
  <div class="card gold">
    <span>เหรียญทอง</span>
    <h1 id="gold">0</h1>
  </div>
  <div class="card silver">
    <span>เหรียญเงิน</span>
    <h1 id="silver">0</h1>
  </div>
  <div class="card bronze">
    <span>เหรียญทองแดง</span>
    <h1 id="bronze">0</h1>
  </div>
</div>

<div class="charts">
  <div class="chart-box">
    <canvas id="barChart"></canvas>
  </div>
  <div class="chart-box">
    <canvas id="pieChart"></canvas>
  </div>
</div>
</div>

<script>
fetch('https://script.google.com/macros/s/AKfycbxxCEyaLlH1WV6O2a8UZrq_gWc29ProRzeuFcDvQH72_2AS_fFwD30EQPDcp1UJPTYJ3w/exec')
.then(res => res.json())
.then(data => {

  // ตัวเลข
  document.getElementById('win').innerText = data['ชนะเลิศ'];
  document.getElementById('gold').innerText = data['เหรียญทอง'];
  document.getElementById('silver').innerText = data['เหรียญเงิน'];
  document.getElementById('bronze').innerText = data['เหรียญทองแดง'];

  // Bar Chart
  new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: ['ชนะเลิศ','เหรียญทอง','เหรียญเงิน','เหรียญทองแดง'],
      datasets: [{
        data: [
          data['ชนะเลิศ'],
          data['เหรียญทอง'],
          data['เหรียญเงิน'],
          data['เหรียญทองแดง']
        ],
        backgroundColor: ['#6366f1','#facc15','#9ca3af','#fb923c']
      }]
    },
    options: {
      plugins: { legend: { display: false } }
    }
  });

  // Pie Chart
  new Chart(document.getElementById('pieChart'), {
    type: 'pie',
    data: {
      labels: ['ชนะเลิศ','เหรียญทอง','เหรียญเงิน','เหรียญทองแดง'],
      datasets: [{
        data: [
          data['ชนะเลิศ'],
          data['เหรียญทอง'],
          data['เหรียญเงิน'],
          data['เหรียญทองแดง']
        ],
        backgroundColor: ['#6366f1','#facc15','#9ca3af','#fb923c']
      }]
    }
  });

});
</script>

</body>
</html>
